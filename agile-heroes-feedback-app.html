    function TrainerIcon({ onClick }) {
      return (
        <div style={{ position: "fixed", bottom: "24px", right: "28px", zIndex: 10, cursor: "pointer", opacity: 0.2 }} onClick={onClick}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="11" width="18" height="12" rx="2" stroke="#888" strokeWidth="1.8"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#888" strokeWidth="1.8" strokeLinecap="round"/>
            <circle cx="12" cy="16" r="1.5" fill="#888"/>
          </svg>
        </div>
      );
    }

    function StarRating({ value, onChange }) {
      const [hovered, setHovered] = useState(0);
      return (
        <div style={{ display: "flex", gap: "8px" }}>
          {[1,2,3,4,5].map(star => (
            <button key={star}
              onClick={() => onChange(star)}
              onMouseEnter={() => setHovered(star)}
              onMouseLeave={() => setHovered(0)}
              style={{ background: "none", border: "none", cursor: "pointer", fontSize: "40px", lineHeight: 1, padding: 0,
                color: star <= (hovered || value) ? C.pink : "rgba(255,255,255,0.15)",
                transition: "color 0.12s, transform 0.1s",
                transform: star <= (hovered || value) ? "scale(1.15)" : "scale(1)" }}>
              ★
            </button>
          ))}
        </div>
      );
    }

    function ProgressBar({ step }) {
      return (
        <div style={{ display: "flex", gap: "4px", marginBottom: "40px" }}>
          {Array.from({ length: TOTAL_STEPS }).map((_, i) => (
            <div key={i} style={{
              flex: 1, height: "3px", borderRadius: "99px",
              background: (i <= step) ? stepColor(i) : "rgba(255,255,255,0.08)",
              opacity: i < step ? 0.5 : 1,
              transition: "background 0.3s"
            }} />
          ))}
        </div>
      );
    }

    }
    function App() {
      const [view, setView] = useState("form");
      const [step, setStep] = useState(0);
      const [selectedModule, setSelectedModule] = useState("");
      const [ratings, setRatings] = useState({ inhalt: 0, didaktik: 0, gestaltung: 0, trainer: 0 });
      const [followUps, setFollowUps] = useState({ inhalt: "", didaktik: "", gestaltung: "", trainer: "" });
      const [openAnswers, setOpenAnswers] = useState({ erkenntnis: "", ausprobieren: "", takeaway: "" });
      const [name, setName] = useState("");
      const [submitting, setSubmitting] = useState(false);
      const [selectedTrainer, setSelectedTrainer] = useState("");
      const [trainerList, setTrainerList] = useState([]);
      const [loadingTrainers, setLoadingTrainers] = useState(false);
      const [trainerPassword, setTrainerPassword] = useState("");
      const [trainerError, setTrainerError] = useState(false);
      const [feedbackData, setFeedbackData] = useState([]);
      const [filterModule, setFilterModule] = useState("all");
      const [filterTrainer, setFilterTrainer] = useState("all");
      const [loadingData, setLoadingData] = useState(false);

      const getFollowUpType = (s) => s <= 3 ? "low" : s === 4 ? "mid" : "high";

      const canProceed = () => {
        if (step === 0) return selectedModule !== "";
        if (step === 1) return selectedTrainer !== "";
        if (step >= 2 && step <= 5) {
          const r = RATINGS[step - 2];
          if (ratings[r.id] === 0) return false;
          return followUps[r.id].trim() !== "";
        }
        if (step >= 6 && step <= 8) return openAnswers[OPEN_QUESTIONS[step - 6].id].trim() !== "";
        return true;
      };

      const handleNext = async () => {
        if (!canProceed()) return;
        if (step === 0) {
          setStep(1);
          return;
        }
        if (step === 9) setView("confirm");
        else setStep(s => s + 1);
      };

      const handleBack = () => { if (step > 0) setStep(s => s - 1); };

      const resetForm = () => {
        setStep(0); setSelectedModule(""); setName(""); setSelectedTrainer(""); setTrainerList([]);
        setRatings({ inhalt: 0, didaktik: 0, gestaltung: 0, trainer: 0 });
        setFollowUps({ inhalt: "", didaktik: "", gestaltung: "", trainer: "" });
        setOpenAnswers({ erkenntnis: "", ausprobieren: "", takeaway: "" });
        setView("form");
      };

      const handleSubmit = async () => {
        setSubmitting(true);
        const entry = {
          id: Date.now(), module: selectedModule, trainer: selectedTrainer,
          name: name.trim() || "Anonym",
          ratings, followUps, openAnswers,
          timestamp: new Date().toISOString()
        };
        const url = SHEET_URL + "?action=submit&data=" + encodeURIComponent(JSON.stringify(entry));
        await new Promise((resolve) => {
          const img = new Image();
          img.onload = resolve;
          img.onerror = resolve;
          img.src = url;
          setTimeout(resolve, 3000);
        });
        setSubmitting(false);
        setView("thanks");
      };

      const loadFeedback = async () => {
        setLoadingData(true);
        try {
          const res = await fetch(SHEET_URL);
          const rows = await res.json();
          const items = rows.map((obj, i) => ({
            id: i,
            module: obj["Modul"] || "",
            trainer: obj["Trainer"] || "",
            name: obj["Name"] || "",
            timestamp: obj["Zeitstempel"] || "",
            ratings: {
              inhalt: parseInt(obj["Inhalte ★"]) || 0,
              didaktik: parseInt(obj["Didaktik ★"]) || 0,
              gestaltung: parseInt(obj["Aufbau ★"]) || 0,
              trainer: parseInt(obj["Trainer ★"]) || 0,
            },
            followUps: {
              inhalt: obj["Inhalte Kommentar"] || "",
              didaktik: obj["Didaktik Kommentar"] || "",
              gestaltung: obj["Aufbau Kommentar"] || "",
              trainer: obj["Trainer Kommentar"] || "",
            },
            openAnswers: {
              erkenntnis: obj["Erkenntnis"] || "",
              ausprobieren: obj["Ausprobieren"] || "",
              takeaway: obj["Take-away"] || "",
            }
          }));
          setFeedbackData(items.reverse());
        } catch(e) {}
        setLoadingData(false);
      };

      const handleTrainerLogin = () => {
        if (trainerPassword === TRAINER_PASSWORD) { setView("trainer"); loadFeedback(); }
        else setTrainerError(true);
      };

      // Styles
      const base = { minHeight: "100vh", background: C.dark, fontFamily: "'Nunito', sans-serif", color: C.text, position: "relative" };
      const wrap = { maxWidth: "620px", margin: "0 auto", padding: "48px 24px 100px", position: "relative", zIndex: 1 };
      const card = { background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: "16px", padding: "32px", marginBottom: "14px" };
      const lbl = (color) => ({ fontSize: "10px", fontWeight: "800", color: color || C.teal, letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px", display: "block" });
      const qst = { fontSize: "20px", fontWeight: "700", color: C.text, marginBottom: "24px", lineHeight: "1.4" };
      const fup = { fontSize: "14px", color: C.mutedLight, marginTop: "24px", marginBottom: "10px", fontStyle: "italic", lineHeight: "1.5" };
      const taStyle = (highlight) => ({ width: "100%", background: "rgba(255,255,255,0.05)", border: "1px solid " + (highlight ? "rgba(232,192,122,0.4)" : "rgba(255,255,255,0.1)"), borderRadius: "10px", padding: "14px 16px", color: C.text, fontSize: "15px", fontFamily: "'Nunito',sans-serif", resize: "vertical", minHeight: "100px", outline: "none", boxSizing: "border-box", lineHeight: "1.6" });
      const inpStyle = { width: "100%", background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: "10px", padding: "14px 16px", color: C.text, fontSize: "15px", fontFamily: "'Nunito',sans-serif", outline: "none", boxSizing: "border-box" };
      const btnPrimary = (color, disabled) => ({ background: disabled ? color + "55" : color, color: color === C.gold ? "#1a1a1a" : "#fff", border: "none", borderRadius: "10px", padding: "14px 32px", fontSize: "15px", fontWeight: "700", cursor: disabled ? "not-allowed" : "pointer", fontFamily: "'Nunito',sans-serif" });
      const ghost = { background: "transparent", color: C.muted, border: "1px solid rgba(255,255,255,0.08)", borderRadius: "10px", padding: "14px 24px", fontSize: "15px", cursor: "pointer", fontFamily: "'Nunito',sans-serif" };
      const modBtn = (sel) => ({ background: sel ? C.pink : "rgba(255,255,255,0.04)", color: sel ? "#fff" : C.mutedLight, border: sel ? "1px solid " + C.pink : "1px solid rgba(255,255,255,0.08)", borderRadius: "10px", padding: "12px 14px", fontSize: "14px", fontWeight: sel ? "700" : "600", cursor: "pointer", textAlign: "center", transition: "all 0.15s", fontFamily: "'Nunito',sans-serif" });

      const NavRow = ({ label, color, disabled, showBack = true }) => (
        <div style={{ display: "flex", justifyContent: showBack ? "space-between" : "flex-end", marginTop: "24px" }}>
          {showBack && <button style={ghost} onClick={handleBack}>Zurück</button>}
          <button style={btnPrimary(color, disabled)} onClick={handleNext}>{label}</button>
        </div>
      );

      // THANK YOU
      if (view === "thanks") return (
        <div style={base}><MeshBg/><NetworkLines/>
          <div style={{ ...wrap, textAlign: "center", paddingTop: "80px" }}>
            <AHILogo/>
            <div style={{ marginBottom: "28px" }}>
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#87cdcb" strokeWidth="1.5"/>
                <path d="M8 12L11 15L16 9" stroke="#87cdcb" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <h1 style={{ fontSize: "28px", fontWeight: "800", marginBottom: "16px" }}>Vielen herzlichen Dank!</h1>
            <p style={{ fontSize: "16px", color: C.muted, lineHeight: "1.75", maxWidth: "440px", margin: "0 auto 36px" }}>
              Dein Feedback hilft uns dabei, die KI-Manager Ausbildung kontinuierlich zu verbessern und noch wertvoller zu gestalten. Für dich und alle zukünftigen Teilnehmer. Das bedeutet uns wirklich viel.
            </p>
            <div style={{ display: "inline-block", padding: "16px 24px", background: "rgba(135,205,203,0.08)", border: "1px solid rgba(135,205,203,0.2)", borderRadius: "12px", marginBottom: "36px" }}>
              <p style={{ color: C.teal, fontWeight: "700", margin: 0, fontSize: "15px" }}>Basti und das Agile Heroes Team</p>
            </div>
            <div>
              <button style={ghost} onClick={resetForm}>Neues Feedback geben</button>
            </div>
          </div>
        </div>
      );

      // CONFIRM
      if (view === "confirm") return (
        <div style={base}><MeshBg/><NetworkLines/>
          <div style={{ ...wrap, textAlign: "center", paddingTop: "80px" }}>
            <AHILogo/>
            <div style={{ marginBottom: "28px" }}>
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 2L11 13" stroke="#e8c07a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#e8c07a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <span style={{ fontSize: "10px", fontWeight: "800", color: C.gold, letterSpacing: "2px", textTransform: "uppercase" }}>Letzter Schritt</span>
            <h1 style={{ fontSize: "26px", fontWeight: "800", margin: "12px 0 16px" }}>Bereit zum Absenden?</h1>
            <p style={{ fontSize: "16px", color: C.muted, lineHeight: "1.7", maxWidth: "400px", margin: "0 auto 16px" }}>
              Dein Feedback ist vollständig. Ein Klick, und du machst die Ausbildung besser.
            </p>
            <p style={{ fontSize: "14px", color: "rgba(255,255,255,0.2)", marginBottom: "40px" }}>
              Du kannst auch nochmal zurückgehen und etwas anpassen.
            </p>
            <div style={{ display: "flex", gap: "14px", justifyContent: "center" }}>
              <button style={ghost} onClick={() => { setView("form"); setStep(8); }}>Zurück</button>
              <button className="pulse" style={{ ...btnPrimary(C.gold, submitting), padding: "16px 40px", fontSize: "16px", borderRadius: "10px" }}
                onClick={handleSubmit} disabled={submitting}>
                {submitting ? "Wird gesendet..." : "Feedback absenden"}
              </button>
            </div>
          </div>
        </div>
      );

      // TRAINER LOGIN
      if (view === "trainer-login") return (
        <div style={base}><MeshBg/><NetworkLines/>
          <div style={{ ...wrap, maxWidth: "420px" }}>
            <div style={{ paddingTop: "80px" }}>
              <AHILogo/>
              <h1 style={{ fontSize: "26px", fontWeight: "800", marginBottom: "8px" }}>Trainer-Zugang</h1>
              <p style={{ fontSize: "15px", color: C.muted, marginBottom: "28px" }}>
                Bitte gib das Passwort ein, um zur Feedback-Auswertung zu gelangen.
              </p>
              <input type="password" style={inpStyle} placeholder="Passwort" value={trainerPassword}
                onChange={e => { setTrainerPassword(e.target.value); setTrainerError(false); }}
                onKeyDown={e => e.key === "Enter" && handleTrainerLogin()} />
              {trainerError && <p style={{ color: "#ef4444", fontSize: "13px", marginTop: "8px" }}>Falsches Passwort.</p>}
              <div style={{ display: "flex", gap: "12px", marginTop: "20px" }}>
                <button style={btnPrimary(C.teal, false)} onClick={handleTrainerLogin}>Anmelden</button>
                <button style={ghost} onClick={() => setView("form")}>Zurück</button>
              </div>
            </div>
          </div>
        </div>
      );

      // TRAINER DASHBOARD
      if (view === "trainer") {
        const filtered = feedbackData.filter(f => (filterModule === "all" || f.module === filterModule) && (filterTrainer === "all" || f.trainer === filterTrainer));
        const availableTrainers = [...new Set(feedbackData.map(f => f.trainer).filter(Boolean))].sort((a,b) => a.localeCompare(b, "de"));
        const avg = (key) => { const v = filtered.filter(f => f.ratings[key] > 0); if (!v.length) return ""; return (v.reduce((a,b) => a + b.ratings[key], 0) / v.length).toFixed(1); };
        const avgColor = (a) => { const n = parseFloat(a); if (isNaN(n)) return C.muted; if (n >= 4.1) return "#6ee7b7"; if (n >= 3.0) return "#f0a86b"; return "#ef4444"; };
        return (
          <div style={base}><MeshBg/><NetworkLines/>
            <div style={wrap}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "24px" }}>
                <AHILogo/>
                <button style={{ ...ghost, fontSize: "13px", padding: "8px 16px" }} onClick={() => { setView("form"); setTrainerPassword(""); setFilterModule("all"); setFilterTrainer("all"); }}>Abmelden</button>
              </div>
              <h1 style={{ fontSize: "26px", fontWeight: "800", marginBottom: "6px" }}>Feedback-Auswertung</h1>
              <p style={{ color: C.muted, fontSize: "14px", marginBottom: "24px" }}>KI-Manager Ausbildung</p>
              <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", marginBottom: "12px" }}>
                <span style={{ fontSize: "10px", fontWeight: "800", color: C.teal, letterSpacing: "1.5px", textTransform: "uppercase", alignSelf: "center", marginRight: "4px" }}>Modul</span>
                <button style={modBtn(filterModule === "all")} onClick={() => setFilterModule("all")}>Alle</button>
                {MODULES.map(m => <button key={m} style={modBtn(filterModule === m)} onClick={() => setFilterModule(m)}>{m}</button>)}
              </div>
              <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", marginBottom: "24px" }}>
                  <span style={{ fontSize: "10px", fontWeight: "800", color: C.pink, letterSpacing: "1.5px", textTransform: "uppercase", alignSelf: "center", marginRight: "4px" }}>Trainer</span>
                  <button style={modBtn(filterTrainer === "all")} onClick={() => setFilterTrainer("all")}>Alle</button>
                  {availableTrainers.map(t => <button key={t} style={modBtn(filterTrainer === t)} onClick={() => setFilterTrainer(t)}>{t}</button>)}
                </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: "10px", marginBottom: "28px" }}>
                {RATINGS.map(r => { const a = avg(r.id); return (
                  <div key={r.id} style={{ ...card, padding: "16px", textAlign: "center", marginBottom: 0 }}>
                    <div style={{ fontSize: "26px", fontWeight: "800", color: avgColor(a) }}>{a || "–"}</div>
                    <div style={{ fontSize: "11px", color: C.muted, marginTop: "4px" }}>{r.label}</div>
                  </div>
                );})}
              </div>
              <div style={{ display: "flex", gap: "12px", alignItems: "center", marginBottom: "20px" }}>
                <p style={{ color: "#444", fontSize: "12px", margin: 0 }}>
                  {filtered.length} {filtered.length !== 1 ? "Antworten" : "Antwort"}{filterModule !== "all" ? " · " + filterModule : ""}
                </p>
                <button style={{ ...ghost, fontSize: "12px", padding: "6px 14px" }} onClick={loadFeedback}>Aktualisieren</button>
              </div>
              {loadingData ? <p style={{ color: C.muted }}>Lade Daten...</p>
              : filtered.length === 0
                ? <div style={{ ...card, textAlign: "center", padding: "48px" }}><p style={{ color: C.muted }}>Noch keine Antworten vorhanden.</p></div>
                : filtered.map((entry, idx) => (
                  <div key={idx} style={card}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "18px" }}>
                      <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
                        <span style={{ background: "rgba(219,115,166,0.15)", color: C.pink, borderRadius: "6px", padding: "3px 10px", fontSize: "12px", fontWeight: "700" }}>{entry.module}</span>
                        <span style={{ color: C.muted, fontSize: "12px" }}>
                          {entry.timestamp ? new Date(entry.timestamp).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : ""}
                        </span>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        {entry.trainer && <div style={{ color: C.teal, fontSize: "12px", fontWeight: "700" }}>{entry.trainer}</div>}
                        <div style={{ color: C.muted, fontSize: "12px" }}>{entry.name}</div>
                      </div>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: "10px", marginBottom: "18px" }}>
                      {RATINGS.map(r => (
                        <div key={r.id} style={{ background: "rgba(255,255,255,0.03)", borderRadius: "10px", padding: "12px" }}>
                          <div style={{ fontSize: "10px", color: C.muted, marginBottom: "6px" }}>{r.label}</div>
                          <div style={{ color: C.pink, fontSize: "14px", letterSpacing: "2px" }}>
                            {"★".repeat(entry.ratings[r.id])}{"☆".repeat(5 - entry.ratings[r.id])}
                          </div>
                          {entry.followUps[r.id] && (
                            <div style={{ fontSize: "11px", color: "#64748b", marginTop: "8px", fontStyle: "italic", lineHeight: "1.4" }}>
                              "{entry.followUps[r.id]}"
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                    <div style={{ borderTop: "1px solid rgba(255,255,255,0.05)", paddingTop: "16px", display: "flex", flexDirection: "column", gap: "12px" }}>
                      {[
                        ["Größte Erkenntnis", entry.openAnswers.erkenntnis],
                        ["Konkret ausprobieren", entry.openAnswers.ausprobieren],
                        ["Take-away als KI-Manager", entry.openAnswers.takeaway]
                      ].filter(([,v]) => v).map(([label, val]) => (
                        <div key={label}>
                          <div style={{ fontSize: "10px", color: C.muted, letterSpacing: "1px", textTransform: "uppercase", marginBottom: "4px" }}>{label}</div>
                          <div style={{ fontSize: "14px", color: C.mutedLight, lineHeight: "1.6" }}>{val}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
            </div>
          </div>
        );
      }

      // MAIN FORM
      const ok = canProceed();
      const color = stepColor(step);

      return (
        <div style={base}><MeshBg/><NetworkLines/>
          {step === 0 && <TrainerIcon onClick={() => setView("trainer-login")} />}
          <div style={wrap}>
            <AHILogo/>
            <ProgressBar step={step}/>

            {step === 0 && (
              <div style={card}>
                <span style={lbl(C.teal)}>Modul auswählen</span>
                <p style={qst}>Welches Modul hast du gerade abgeschlossen?</p>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(130px,1fr))", gap: "10px" }}>
                  {MODULES.map(m => <button key={m} style={modBtn(selectedModule === m)} onClick={async () => {
                    setSelectedModule(m);
                    setSelectedTrainer("");
                    setLoadingTrainers(true);
                    try {
                      const res = await fetch(SHEET_URL + "?action=getTrainers&modul=" + encodeURIComponent(m));
                      const list = await res.json();
                      setTrainerList([...list].sort((a, b) => a.localeCompare(b, "de")));
                    } catch(e) { setTrainerList([]); }
                    setLoadingTrainers(false);
                  }}>{m}</button>)}
                </div>
                <div style={{ display: "flex", justifyContent: "flex-end", marginTop: "24px" }}>
                  <button style={btnPrimary(C.teal, !ok)} onClick={handleNext}>Weiter</button>
                </div>
              </div>
            )}

            {step === 1 && (
              <div style={card}>
                <span style={lbl(C.teal)}>Trainer auswählen</span>
                <p style={qst}>Wer hat dich in diesem Modul als Trainer begleitet?</p>
                {loadingTrainers ? (
                  <div style={{ display: "flex", alignItems: "center", gap: "12px", color: C.muted, fontSize: "14px" }}>
                    <span style={{ display: "inline-block", width: "16px", height: "16px", border: "2px solid " + C.teal, borderTopColor: "transparent", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
                    Trainer werden geladen...
                  </div>
                ) : trainerList.length === 0 ? (
                  <p style={{ color: C.muted, fontStyle: "italic", fontSize: "14px" }}>
                    Keine Trainer für dieses Modul hinterlegt.
                  </p>
                ) : (
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(160px,1fr))", gap: "10px" }}>
                    {trainerList.map(t => <button key={t} style={modBtn(selectedTrainer === t)} onClick={() => setSelectedTrainer(t)}>{t}</button>)}
                  </div>
                )}
                <NavRow label="Weiter" color={C.teal} disabled={!ok} />
              </div>
            )}

            {step >= 2 && step <= 5 && (() => {
              const r = RATINGS[step - 2];
              const score = ratings[r.id];
              const type = score > 0 ? getFollowUpType(score) : null;
              const followupFilled = followUps[r.id].trim() !== "";
              return (
                <div style={card}>
                  <span style={lbl(C.pink)}>{r.label}</span>
                  <p style={qst}>{r.question}</p>
                  <StarRating value={score} onChange={v => {
                    setRatings(prev => ({...prev, [r.id]: v}));
                    setFollowUps(prev => ({...prev, [r.id]: ""}));
                  }}/>
                  {type ? (
                    <>
                      <p style={fup}>{r.followUp[type]}</p>
                      <textarea style={taStyle(!followupFilled)}
                        placeholder="Deine Antwort (Pflichtfeld)..."
                        value={followUps[r.id]}
                        onChange={e => setFollowUps(prev => ({...prev, [r.id]: e.target.value}))} />
                    </>
                  ) : (
                    <p style={{ fontSize: "13px", color: "rgba(255,255,255,0.2)", marginTop: "20px", fontStyle: "italic" }}>
                      Bitte wähle zunächst eine Bewertung aus.
                    </p>
                  )}
                  <NavRow label="Weiter" color={C.pink} disabled={!ok} />
                </div>
              );
            })()}

            {step >= 6 && step <= 8 && (() => {
              const q = OPEN_QUESTIONS[step - 6];
              const filled = openAnswers[q.id].trim() !== "";
              return (
                <div style={card}>
                  <span style={lbl(C.gold)}>Deine Reflexion</span>
                  <p style={qst}>{q.q}</p>
                  <textarea style={taStyle(!filled)}
                    placeholder="Deine Antwort (Pflichtfeld)..."
                    value={openAnswers[q.id]}
                    onChange={e => setOpenAnswers(prev => ({...prev, [q.id]: e.target.value}))} />
                  <NavRow label="Weiter" color={C.gold} disabled={!ok} />
                </div>
              );
            })()}

            {step === 9 && (
              <div style={card}>
                <span style={lbl(C.gold)}>Fast geschafft</span>
                <p style={qst}>Möchtest du deinen Namen hinterlassen?</p>
                <p style={{ fontSize: "14px", color: C.muted, marginBottom: "16px", lineHeight: "1.6" }}>
                  Dein Feedback ist standardmäßig anonym. Du kannst deinen Namen freiwillig angeben.
                </p>
                <input type="text" style={inpStyle} placeholder="Dein Name (optional)..."
                  value={name} onChange={e => setName(e.target.value)} />
                <NavRow label={name.trim() ? "Weiter" : "Überspringen"} color={C.gold} disabled={false} />
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
